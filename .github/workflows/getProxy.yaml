name: Get Proxies and push proxies

on:
  schedule:
    # Every 3 hours. GitHub may delay or drop scheduled runs under load.
    - cron: "0 */3 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Shared with checkProxy.yaml so scrapes and checks never push concurrently.
concurrency:
  group: proxy-data-write
  cancel-in-progress: false

jobs:
  get_proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Scrape proxies
        run: |
          python3 proxyScraper.py -p http -o proxies/http.txt
          python3 proxyScraper.py -p https -o proxies/https.txt
          python3 proxyScraper.py -p socks4 -o proxies/socks4.txt
          python3 proxyScraper.py -p socks5 -o proxies/socks5.txt

      - name: Commit and push changes
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add proxies/http.txt proxies/https.txt proxies/socks4.txt proxies/socks5.txt
          if git diff --cached --quiet; then
            echo "Proxy lists unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "feat: update proxies"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
