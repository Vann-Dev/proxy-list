name: Update proxy lists

on:
  schedule:
    # Every 3 hours. GitHub may delay or drop scheduled runs under load.
    - cron: "0 */3 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# One pipeline at a time: checks and the publish commit never overlap.
concurrency:
  group: proxy-data-write
  cancel-in-progress: false

env:
  DOMAINS: google.com facebook.com twitter.com tiktok.com youtube.com whatsapp.com microsoft.com discord.com instagram.com
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    name: Check ${{ matrix.protocol }} proxies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        protocol: [http, https, socks4, socks5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore freshness state
        uses: actions/cache@v4
        with:
          path: .cache/proxy-state.json
          key: proxy-state-${{ matrix.protocol }}-${{ github.run_id }}
          restore-keys: |
            proxy-state-${{ matrix.protocol }}-

      - name: Scrape ${{ matrix.protocol }} proxies
        run: |
          python3 proxyScraper.py -p "${{ matrix.protocol }}" -o "proxies/${{ matrix.protocol }}.txt" \
            || echo "::warning::Scrape failed for ${{ matrix.protocol }}; keeping the previous list"

      - name: Check ${{ matrix.protocol }} proxies against every domain
        run: |
          set -uo pipefail
          domains=($DOMAINS)
          sites=()
          for domain in "${domains[@]}"; do
            sites+=("-s" "$domain")
          done

          # Each protocol runs on its own runner, so the four lists finish in
          # parallel instead of one after another.
          python3 proxyChecker.py \
            -p "${{ matrix.protocol }}" \
            -l "proxies/${{ matrix.protocol }}.txt" \
            --output-dir "proxies/${{ matrix.protocol }}-tested" \
            --timeout 6 \
            --concurrency 500 \
            --retries 0 \
            --report "proxies/${{ matrix.protocol }}-tested/meta.json" \
            --json-out "proxies/${{ matrix.protocol }}-tested/proxies.json" \
            --anonymity \
            --state .cache/proxy-state.json \
            "${sites[@]}" \
            || echo "::warning::Check did not finish for ${{ matrix.protocol }}; keeping the previous results"

      - name: Stage results
        run: |
          set -uo pipefail
          mkdir -p upload/proxies
          [ -f "proxies/${{ matrix.protocol }}.txt" ] \
            && cp "proxies/${{ matrix.protocol }}.txt" upload/proxies/
          [ -d "proxies/${{ matrix.protocol }}-tested" ] \
            && cp -r "proxies/${{ matrix.protocol }}-tested" upload/proxies/

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.protocol }}
          path: upload/
          if-no-files-found: warn
          retention-days: 3

  publish:
    name: Publish catalog
    needs: check
    if: ${{ always() && needs.check.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download check results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: .

      - name: Build JSON catalog and stats
        run: |
          python3 proxyCatalog.py --geo-cache .cache/ip2asn-v4-u32.tsv.gz

      - name: Commit and push once
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add proxies
          if git diff --cached --quiet; then
            echo "Proxy data unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh proxy lists"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
