name: Update proxy lists

on:
  schedule:
    # Every 3 hours. GitHub may delay or drop scheduled runs under load.
    - cron: "0 */3 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# One pipeline at a time: scrapes, checks and pushes never overlap.
concurrency:
  group: proxy-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore freshness state
        uses: actions/cache@v4
        with:
          path: .cache/proxy-state.json
          key: proxy-state-${{ github.run_id }}
          restore-keys: |
            proxy-state-

      - name: Scrape proxies
        run: |
          set -uo pipefail
          for protocol in http https socks4 socks5; do
            echo "::group::Scraping $protocol"
            python3 proxyScraper.py -p "$protocol" -o "proxies/$protocol.txt" \
              || echo "::warning::Scrape failed for $protocol; keeping the previous list"
            echo "::endgroup::"
          done

      - name: Check proxies against every domain
        run: |
          set -uo pipefail
          domains=(google.com facebook.com twitter.com tiktok.com youtube.com whatsapp.com microsoft.com discord.com instagram.com)
          sites=()
          for domain in "${domains[@]}"; do
            sites+=("-s" "$domain")
          done

          # SOCKS4 uses a small stdlib implementation; SOCKS5 uses httpx[socks].
          for protocol in http https socks4 socks5; do
            echo "::group::Checking $protocol proxies"
            python3 proxyChecker.py \
              -p "$protocol" \
              -l "proxies/$protocol.txt" \
              --output-dir "proxies/$protocol-tested" \
              --timeout 6 \
              --concurrency 300 \
              --retries 0 \
              --report "proxies/$protocol-tested/meta.json" \
              --json-out "proxies/$protocol-tested/proxies.json" \
              --anonymity \
              --state .cache/proxy-state.json \
              "${sites[@]}" \
              || echo "::warning::Check did not finish for $protocol; keeping the previous results"
            echo "::endgroup::"
          done

      - name: Build JSON catalog and stats
        run: |
          python3 proxyCatalog.py --geo-cache .cache/ip2asn-v4-u32.tsv.gz

      - name: Commit and push once
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add proxies
          if git diff --cached --quiet; then
            echo "Proxy data unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh proxy lists"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
