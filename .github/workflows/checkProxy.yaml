name: Check and push proxies

on:
  workflow_run:
    workflows:
      - Get Proxies and push proxies
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

# Shared with getProxy.yaml so scrapes and checks never push concurrently.
concurrency:
  group: proxy-data-write
  cancel-in-progress: false

jobs:
  test_proxies:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check proxies against every domain
        run: |
          set -uo pipefail
          domains=(google.com facebook.com twitter.com tiktok.com youtube.com whatsapp.com microsoft.com discord.com instagram.com)
          sites=()
          for domain in "${domains[@]}"; do
            sites+=("-s" "$domain")
          done

          # SOCKS4 uses a small stdlib implementation; SOCKS5 uses httpx[socks].
          for protocol in http https socks4 socks5; do
            echo "::group::Checking $protocol proxies"
            python3 proxyChecker.py \
              -p "$protocol" \
              -l "proxies/$protocol.txt" \
              --output-dir "proxies/$protocol-tested" \
              --timeout 6 \
              --concurrency 300 \
              --retries 0 \
              --report "proxies/$protocol-tested/meta.json" \
              "${sites[@]}"
            echo "::endgroup::"
          done

      - name: Commit and push changes
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add proxies
          if git diff --cached --quiet; then
            echo "Checked proxy lists unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "feat: update checked proxies"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
